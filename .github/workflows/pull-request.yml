name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check handler syntax
        run: node --check src/index.mjs

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without remote state
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

      - name: Initialize and validate state bucket bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
